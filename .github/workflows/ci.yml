name: Check
# Every pull request, and every push to main: the site builds, type-checks, every link resolves, and it works in a
# browser (the suites in tests/e2e). Nothing is deployed here; deploy.yml does that, from main, once this passes.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Type-check the pages and scripts
        run: npm run check
      - name: The books and covers (the library-assets release), for the link check and the browser tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run assets:pull
      - name: Build
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: npm run build
      - name: Every local link, image and font resolves
        run: npm run check:links
      - name: It works in a browser
        run: |
          pip install playwright==1.64.0
          npm run test:e2e
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
