name: Grow
# Every morning, the shelf grows by itself, from two places:
#   - pipeline/grow.py takes the next books from pipeline/queue.json (Standard Ebooks' most read, chosen and described by
#     hand ahead of time),
#   - pipeline/gutenberg_feed.py takes the next of Project Gutenberg's most downloaded English books, with their genres, moods
#     and ages worked out from Gutenberg's own details (see its notes).
# Each book is checked to be free in India (pipeline/rights.py's rule) before it is added. Then the library data is rebuilt,
# the site is built and checked, the books and covers go onto the library-assets release, the change is committed to main,
# and the site is published. When the hand-chosen queue runs low, an issue asks for a refill. On a day with nothing new, or when
# a source cannot be reached, the run ends quietly and the next one carries on.
#
# How many each day: the repository variables GROW_BOOKS (hand-chosen, 10 if not set) and GROW_GUTENBERG (50 if not set), under
# Settings, Secrets and variables, Actions, Variables. Or by hand, from the Actions page, for one run.
#
# Uses the same secrets and variables as deploy.yml (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FIREBASE_CONFIG,
# GOATCOUNTER). A push made here does not start the Check or Deploy workflows (GitHub holds back workflows started by
# the workflow token), so this one builds, checks and publishes itself.
on:
  workflow_dispatch:
    inputs:
      books:
        description: "How many hand-chosen books to add (empty: GROW_BOOKS, or 10)"
        default: ""
      gutenberg:
        description: "How many books to add from Project Gutenberg (empty: GROW_GUTENBERG, or 50)"
        default: ""
  schedule:
    - cron: "30 3 * * *" # 9:00 in India, every morning (GitHub often starts it a few hours later)
permissions:
  contents: write
  issues: write
concurrency:
  group: grow
  cancel-in-progress: false
jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://the-bookshelf.cl0ud-9.workers.dev
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install pillow playwright==1.64.0
      - name: The books and covers already on the shelf
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run assets:pull
      - name: The next hand-chosen books, from the queue
        id: grow
        env:
          BOOKS: ${{ inputs.books || vars.GROW_BOOKS || '10' }}
        run: |
          touch grow.log
          set +e
          python pipeline/grow.py "$BOOKS" | tee grow.log
          code=${PIPESTATUS[0]}
          set -e
          echo "failed=0" >> "$GITHUB_OUTPUT"
          if [ "$code" = 3 ] || [ "$code" = 4 ]; then
            echo "nothing from the queue today (code $code)"
          elif [ "$code" != 0 ]; then
            echo "::error::pipeline/grow.py failed (exit $code); the rest of the run carries on without it"
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: More books, from Project Gutenberg
        id: gutenberg
        env:
          BOOKS: ${{ inputs.gutenberg || vars.GROW_GUTENBERG || '50' }}
        run: |
          touch gutenberg.log
          set +e
          python pipeline/gutenberg_feed.py "$BOOKS" | tee gutenberg.log
          code=${PIPESTATUS[0]}
          set -e
          echo "failed=0" >> "$GITHUB_OUTPUT"
          if [ "$code" = 3 ] || [ "$code" = 4 ]; then
            echo "nothing from Project Gutenberg today (code $code)"
          elif [ "$code" != 0 ]; then
            echo "::error::pipeline/gutenberg_feed.py failed (exit $code); the rest of the run carries on without it"
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: What was added
        id: added
        run: |
          cat grow.log gutenberg.log > added.log
          echo "count=$(grep -c '^added ' added.log || true)" >> "$GITHUB_OUTPUT"
      - name: Fetch the new books and rebuild the library data
        if: steps.added.outputs.count != '0'
        run: |
          python pipeline/library.py --keep
          python pipeline/readme_count.py
      - name: Write the rights check into data/rights.json
        if: steps.added.outputs.count != '0'
        run: python pipeline/rights.py $(grep '^added ' added.log | sed 's/^added \([^:]*\):.*/.assets\/books\/\1.epub/')
      - name: Build
        if: steps.added.outputs.count != '0'
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}
        run: npm run build
      - name: Link previews for the new books
        if: steps.added.outputs.count != '0'
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 &
          preview=$!
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          python pipeline/social.py http://127.0.0.1:4321/ --missing
          kill "$preview" || true
          npm run build
      - name: Every local link, image and font resolves
        if: steps.added.outputs.count != '0'
        run: npm run check:links
      - name: The shelf still works in a browser
        if: steps.added.outputs.count != '0'
        run: npm run test:e2e -- library_check
      - name: Put the new books and covers on the library-assets release
        if: steps.added.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run assets:push
      - name: Commit to main, under the librarian's name
        if: steps.added.outputs.count != '0'
        run: |
          git config user.name "Cl0ud-9"
          git config user.email "tonpe.parag1@gmail.com"
          git add pipeline data README.md
          total=$(grep -c '^added ' added.log)
          names=$(grep '^added ' added.log | sed 's/^added [^:]*: //; s/ (Project Gutenberg.*//' | head -4 | paste -sd ';' - | sed 's/;/; /g')
          git commit -m "Grow the shelf: $total books ($names and more)"
          git pull --rebase origin main
          git push
      - name: Publish to Cloudflare
        if: steps.added.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy
      - name: Keep the screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: grow-test-results
          path: test-results
          if-no-files-found: ignore
      - name: Ask for a refill when the queue runs low
        if: always() && hashFiles('grow.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^QUEUE LOW' grow.log; then
            open=$(gh issue list --state open --search "The book queue is low in:title" --json number --jq 'length')
            if [ "$open" = 0 ]; then
              {
                grep 'waiting in the queue' grow.log | tail -1
                echo
                echo "Ask Claude to refill pipeline/queue.json: the next of Standard Ebooks' most read books, each with genres, moods, a suggested age and notes, in the queue's format."
                echo "Books set aside, with the reason, are in pipeline/queue-skipped.json."
              } > issue.md
              gh issue create --title "The book queue is low" --body-file issue.md
            fi
          fi
      - name: Say so, if a source failed
        if: steps.grow.outputs.failed == '1' || steps.gutenberg.outputs.failed == '1'
        run: |
          echo "A source of books failed today (see its step above); what the other found was published."
          exit 1
