name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # the book of the month changes on the first, so the pages are rebuilt then
  schedule:
    - cron: "0 1 1 * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site's files
        run: |
          mkdir _site
          cp -r index.html books.html genres.html faq.html book-*.html read.html reading.html account.html profile.html privacy.html login.html signup.html 404.html sitemap.xml feed.xml manifest.webmanifest sw.js css js image fonts books _site/
      - name: Rebuild the pages for today (book of the month)
        # Repository variables, both optional. GOATCOUNTER: the site's GoatCounter code (empty: nothing is counted).
        # FIREBASE_CONFIG: the Firebase web app's configuration, as JSON (empty: no accounts). README has the steps.
        env:
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: python3 tools/build.py _site
      - name: Type-check the scripts that declare their types (jsconfig.json)
        run: npx --yes -p typescript@5.9.3 tsc -p jsconfig.json
      - name: Check every local link and image resolves
        run: |
          missing=0
          for page in _site/*.html; do
            # href, src, and every file in srcset lists; /Book-Website/ is the site's own root on Pages.
            # Links to other sites (with a colon) are skipped; ?query and #fragment are dropped before checking.
            refs=$(grep -oE '(href|src)="[^":]+"' "$page" | sed -E 's/^(href|src)="//; s/"$//; s/[?#].*//')
            sets=$(grep -oE '(srcset|imagesrcset)="[^"]+"' "$page" | sed -E 's/^[a-z]+="//; s/"$//' | tr ',' '\n' | awk '{print $1}')
            for ref in $refs $sets; do
              path="_site/${ref#/Book-Website/}"
              [ -e "$path" ] || { echo "$page: missing $ref"; missing=1; }
            done
          done
          # link previews name their image by the site's full address
          for page in _site/*.html; do
            for ref in $(grep -oE 'property="og:image" content="[^"]+"' "$page" | sed -E 's/.*content="//; s/"$//'); do
              path="_site/${ref#https://cl0ud-9.github.io/Book-Website/}"
              [ -e "$path" ] || { echo "$page: missing preview $ref"; missing=1; }
            done
          done
          for css in _site/css/*.css; do
            for ref in $(grep -oE 'url\([^)]+\)' "$css" | sed -E 's/url\(//; s/\)$//; s/["'"'"']//g' | grep -v '^data:'); do
              [ -e "_site/css/$ref" ] || { echo "$css: missing $ref"; missing=1; }
            done
          done
          exit $missing
      - name: Check speed, accessibility and search basics on a phone (Lighthouse, budgets in .lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
