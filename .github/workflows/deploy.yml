name: Deploy
# The site, to Cloudflare Pages: on every push to main (once it builds and its pages pass Lighthouse), by hand, and on
# the first of every month, when the book of the month changes. The books and covers come from Cloudflare R2.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (Pages: edit), R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (R2: read).
# Repository variables: CLOUDFLARE_ACCOUNT_ID, and, both optional, FIREBASE_CONFIG (accounts) and GOATCOUNTER (counting).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://the-bookshelf.pages.dev
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The books and covers, from Cloudflare R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: sudo apt-get install -y rclone && npm run assets:pull
      - name: Build (for today: the book of the month)
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}
        run: npm run build
      - name: Every local link, image and font resolves
        run: npm run check:links
      - name: Speed, accessibility and search basics on a phone (Lighthouse, budgets in .lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 pages deploy dist --project-name the-bookshelf --branch main --commit-dirty=true
