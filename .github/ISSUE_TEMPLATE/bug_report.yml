name: Bug report
description: Something looks broken or does not work on the site
labels: [bug]
body:
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - Home
        - Log in
        - Sign up
        - Running it locally (npm start)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: shot
    attributes:
      label: A screenshot
      description: Drag it in here.
  - type: input
    id: env
    attributes:
      label: Browser, device and screen size
      placeholder: Chrome 140 on Android, 412 px wide
