<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | The Bookshelf</title>
  <meta name="description" content="Create an account on The Bookshelf, a bookshop front page built with plain HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#1e8449">
  <link rel="icon" href="image/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <script src="js/forms.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Sign up</h1>
  </header>
  <main>
    <form class="card" data-validate="signup" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" aria-describedby="username-error">
        <p class="error" id="username-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password">Password <span class="hint">(at least 6 characters)</span></label>
        <input type="password" id="password" name="password" autocomplete="new-password" aria-describedby="password-error">
        <p class="error" id="password-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" aria-describedby="confirm-error">
        <p class="error" id="confirm-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="contact">Contact number <span class="hint">(10 digits)</span></label>
        <input type="tel" id="contact" name="contact" autocomplete="tel-national" inputmode="numeric" maxlength="10" aria-describedby="contact-error">
        <p class="error" id="contact-error" aria-live="polite"></p>
      </div>
      <input type="submit" value="Sign up">
      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      <p class="links"><a href="login.html">Have an account? Log in</a> · <a href="./">Home</a></p>
    </form>
  </main>
</body>
</html>
