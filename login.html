<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | The Bookshelf</title>
  <meta name="description" content="Log in to The Bookshelf, a bookshop front page built with plain HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#1e8449">
  <link rel="icon" href="image/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <script src="js/forms.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Log in</h1>
  </header>
  <main>
    <form class="card" data-validate="login" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" aria-describedby="username-error">
        <p class="error" id="username-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="password-error">
        <p class="error" id="password-error" aria-live="polite"></p>
      </div>
      <input type="submit" value="Log in">
      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      <p class="links"><a href="signup.html">New here? Sign up</a> · <a href="./">Home</a></p>
    </form>
  </main>
</body>
</html>
